; Dumbbell motion sensor: ESP32-S3 + MPU6050, streaming to the website over Bluetooth LE.
; Flash with:  pio run -t upload      Watch logs with:  pio device monitor
; See README.md for wiring and first-run calibration.

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  ; Serial goes to the native USB port, so logs appear on whichever USB-C port you flash through.
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
