<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8ef" />
    <!-- Applies a saved Light/Dark choice before the first paint (src/theme.js). -->
    <script>
      try {
        const theme = localStorage.getItem('exercise-tracker:theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..800&display=swap" />
    <title>Pose benchmark · Exercise Tracker</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/benchmark-page.js"></script>
  </body>
</html>
